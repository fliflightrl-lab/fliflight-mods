# Fliflight Vanilla Plus v0.8 - Potato
# no fog + bloom + shadows + waving foliage + water swell + custom sky

# Bloom en DEMI-RESOLUTION : la passe composite ecrit 4x moins de pixels.
# Syntaxe officielle OptiFine : taille relative (0.5 0.5 = moitie de la resolution).
# Contrainte respectee : `composite` ecrit UNIQUEMENT colortex1 (DRAWBUFFERS:1),
# et seuls les programmes prepare/deferred/composite peuvent ecrire en taille fixe.
size.buffer.colortex1=0.5 0.5

shadowMapResolution=1024
shadowDistance=64.0
sunPathRotation=0.0

# --- CHEMIN RAPIDE OPTIFINE (le plus gros levier de perf du pack) ---
# Sans ces directives, OptiFine desactive son rendu rapide pour ces programmes et
# ne peut pas fusionner l'opaque et le cutout : le terrain est rendu en plusieurs
# passes. Le shader n'a pas besoin de faire le discard lui-meme, OptiFine s'en
# charge d'apres ces seuils (c'est ce que fait BSL).
alphaTest.gbuffers_terrain=GREATER 0.1
alphaTest.gbuffers_clouds=GREATER 0.005
alphaTest.gbuffers_hand=GREATER 0.005
alphaTest.gbuffers_water=GREATER 0.001
alphaTest.gbuffers_weather=GREATER 0.0001
