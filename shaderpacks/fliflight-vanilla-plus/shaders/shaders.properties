# Fliflight Vanilla Plus v0.9 - Potato
# no fog + bloom + waving foliage + water swell + tinted light + custom sky

# ---------------------------------------------------------------------------
# TAILLES DE BUFFER
# ---------------------------------------------------------------------------
# Bloom en DEMI-RESOLUTION : la passe composite ecrit 4x moins de pixels.
# Seuls les programmes prepare/deferred/composite peuvent ecrire en taille fixe,
# et un programme ne peut pas ecrire taille fixe ET taille normale en meme temps
# (composite ecrit uniquement colortex1, DRAWBUFFERS:1).
size.buffer.colortex1=0.5 0.5

# ---------------------------------------------------------------------------
# OMBRES (programme non embarque : garder SHADOWS desactive)
# ---------------------------------------------------------------------------
shadowMapResolution=1024
shadowDistance=64.0
sunPathRotation=0.0

# ---------------------------------------------------------------------------
# CHEMIN RAPIDE OPTIFINE (le plus gros levier de perf du pack)
# Sans ces directives OptiFine desactive son rendu rapide pour ces programmes et
# ne peut pas fusionner l'opaque et le cutout : le terrain est rendu en plusieurs
# passes. Le shader n'a pas besoin de faire le discard lui-meme, OptiFine s'en
# charge d'apres ces seuils (c'est ce que fait BSL).
# ---------------------------------------------------------------------------
alphaTest.gbuffers_terrain=GREATER 0.1
alphaTest.gbuffers_clouds=GREATER 0.005
alphaTest.gbuffers_hand=GREATER 0.005
alphaTest.gbuffers_water=GREATER 0.001
alphaTest.gbuffers_weather=GREATER 0.0001

# ---------------------------------------------------------------------------
# ECRAN D'OPTIONS (Video Settings -> Shader Options)
# Le `*` est volontairement ABSENT : tout ce qui n'est pas liste ici reste cache,
# ce qui empeche d'activer SHADOWS par erreur (le programme d'ombre n'est pas
# dans ce pack, l'activer donnerait des ombres cassees).
# ---------------------------------------------------------------------------
screen=<profile> WAVES WAVE_SCALE BLOOM HORIZON_HAZE SHARPEN <empty> [LIGHT] [WATER] [SKY]
screen.columns=2

screen.LIGHT=LIGHT_TINT LIGHT_TINT_STRENGTH DIRECTIONAL_LIGHT DIRECTIONAL_STRENGTH <empty> <empty> FACE_LIGHT FACE_LIGHT_STRENGTH FACE_TOP_CONTRAST FACE_SUN_CONTRAST <empty> <empty> BLOCK_TINT_R BLOCK_TINT_G BLOCK_TINT_B SKY_TINT_R SKY_TINT_G SKY_TINT_B
screen.WATER=WATER_WAVES WATER_WAVE_HEIGHT WATER_WAVE_SPEED <empty> <empty> <empty> WATER_SPECULAR WATER_SPEC_STRENGTH WATER_SHININESS <empty> <empty> <empty> UNDERWATER_TINT UNDERWATER_STRENGTH
screen.SKY=CUSTOM_SKY SUN_HALO_STRENGTH MOON_HALO_STRENGTH <empty> <empty> <empty> STARS STARS_STRENGTH DUSK_STRENGTH <empty> <empty> <empty> TIME_GRADE CLOUD_SHADING <empty> <empty> <empty> <empty> TONE_ROLLOFF TONE_KNEE

# Toutes ces valeurs deviennent des curseurs au lieu de listes de choix.
sliders=BLOOM_STRENGTH BLOOM_THRESHOLD BLOOM_SPREAD WAVE_SCALE LIGHT_TINT_STRENGTH DIRECTIONAL_STRENGTH FACE_LIGHT_STRENGTH FACE_TOP_CONTRAST FACE_SUN_CONTRAST BLOCK_TINT_R BLOCK_TINT_G BLOCK_TINT_B SKY_TINT_R SKY_TINT_G SKY_TINT_B WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_SPEC_STRENGTH WATER_SHININESS UNDERWATER_STRENGTH SUN_HALO_STRENGTH MOON_HALO_STRENGTH STARS_STRENGTH DUSK_STRENGTH HAZE_START_BLOCKS HAZE_END_BLOCKS HAZE_STRENGTH SATURATION CONTRAST BRIGHTNESS SHARPNESS TONE_KNEE

# ---------------------------------------------------------------------------
# PROFILS
# Tous les profils listent les MEMES options, seules les valeurs changent
# (recommande par la doc OptiFine). Le profil affiche est deduit des valeurs.
# ---------------------------------------------------------------------------
profile.POTATO=BLOOM BLOOM_STRENGTH:0.35 !HORIZON_HAZE !SHARPEN !WATER_SPECULAR !UNDERWATER_TINT FACE_LIGHT TONE_ROLLOFF CLOUD_SHADING STARS WATER_WAVES TIME_GRADE LIGHT_TINT DIRECTIONAL_LIGHT
profile.BALANCED=profile.POTATO BLOOM_STRENGTH:0.45 HORIZON_HAZE WATER_SPECULAR UNDERWATER_TINT
profile.QUALITY=profile.BALANCED BLOOM_STRENGTH:0.55 SHARPEN WATER_SPEC_STRENGTH:0.75
